<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & Operations System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Inventory & Operations</h1>
            <div id="user-info" class="user-info hidden">
                <span id="user-email"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </header>

        <main class="container">
            <div id="auth-section">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showLogin()">Login</button>
                    <button class="tab-btn" onclick="showRegister()">Register</button>
                </div>

                <div id="login-form" class="auth-form">
                    <h2>Login</h2>
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="login-email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>

                <div id="register-form" class="auth-form hidden">
                    <h2>Register</h2>
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="reg-name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="reg-email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="reg-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>
            </div>

            <div id="dashboard" class="hidden">
                <div class="dashboard-header">
                    <h2>Dashboard</h2>
                    <button class="btn btn-primary" onclick="showAddItemForm()">+ Add Item</button>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <h3>Total Items</h3>
                        <p id="stat-total" class="stat-value">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Quantity</h3>
                        <p id="stat-qty" class="stat-value">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Operations Today</h3>
                        <p id="stat-ops" class="stat-value">0</p>
                    </div>
                </div>

                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search by SKU, name, or RFID..." oninput="searchItems()">
                </div>

                <div id="inventory-list" class="inventory-grid"></div>

                <div id="add-item-modal" class="modal hidden">
                    <div class="modal-content">
                        <h3>Add Inventory Item</h3>
                        <form onsubmit="handleAddItem(event)">
                            <div class="form-group">
                                <label>SKU</label>
                                <input type="text" id="item-sku" required>
                            </div>
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" id="item-name" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="item-desc"></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Quantity</label>
                                    <input type="number" id="item-qty" min="0" value="0" required>
                                </div>
                                <div class="form-group">
                                    <label>Location</label>
                                    <input type="text" id="item-location">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>RFID Tag</label>
                                <input type="text" id="item-rfid">
                            </div>
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">Add Item</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="edit-item-modal" class="modal hidden">
                    <div class="modal-content">
                        <h3>Edit Item</h3>
                        <form onsubmit="handleEditItem(event)">
                            <input type="hidden" id="edit-item-id">
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" id="edit-name" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="edit-desc"></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Quantity</label>
                                    <input type="number" id="edit-qty" min="0" required>
                                </div>
                                <div class="form-group">
                                    <label>Location</label>
                                    <input type="text" id="edit-location">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>RFID Tag</label>
                                <input type="text" id="edit-rfid">
                            </div>
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">Update</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="operations-section">
                    <h3>Recent Operations</h3>
                    <div id="operations-list" class="operations-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
